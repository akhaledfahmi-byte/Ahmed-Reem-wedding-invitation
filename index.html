<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reem & Ahmed — Wedding Invitation</title>
<meta name="description" content="Reem Elwesemy & Ahmed Khaled's wedding invitation — Friday, 21 August 2026, Cairo Marriott Hotel">
<style>
  :root {
    --bg: #1a0f0a;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    overflow-x: hidden;
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .invite {
    position: relative;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  .invite img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
  }
  .location-link {
    position: absolute;
    left: 32%;
    top: 28.4%;
    width: 37%;
    height: 1.8%;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="invite">
  <img src="images/invitation.webp" alt="Reem Elwesemy and Ahmed Khaled wedding invitation, Cairo Marriott Hotel, Friday 21 August 2026, 7:00 PM">
  <a class="location-link" href="https://maps.app.goo.gl/Z3wgUbXTLNqepFay5?g_st=com.google.maps.preview.copy" target="_blank" rel="noopener" aria-label="Open location in Google Maps"></a>
</div>

</body>
</html>
